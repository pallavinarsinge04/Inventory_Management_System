<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Inventory Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Authentication Modal Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .auth-card h3 {
            font-size: 1.4rem;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .auth-card p {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 24px;
        }

        .auth-card .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Admin Authentication Modal Overlay -->
    <div id="login-modal" class="auth-overlay">
        <div class="auth-card">
            <h3>🔒 Admin Authentication</h3>
            <p>Operand Technologies • Client Portal</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-user">Username</label>
                    <input type="text" id="login-user" placeholder="Enter username (e.g., admin)" required>
                </div>

                <div class="form-group">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Sign In to Dashboard</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="main-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>📦 Inventory & Order Management System</h1>
                <p>Operand Technologies • Client-Facing Application Portal</p>
            </div>
            <!-- Logout Navigation Control -->
            <div id="user-controls" class="user-nav hidden">
                <button id="logout-btn" class="btn btn-secondary" onclick="handleLogout()">🚪 Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="grid-layout">
            <!-- Add Product Form Card -->
            <div class="card form-card">
                <h2>Add New Product</h2>
                <form id="product-form">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" placeholder="e.g., Wireless Mouse" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Office Supplies">Office Supplies</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" min="0" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price ($)</label>
                            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">➕ Save Item</button>
                </form>
            </div>

            <!-- Product Table Dashboard Card -->
            <div class="card table-card">
                <div class="table-header">
                    <h2>Stock Inventory List</h2>
                    <button id="refresh-btn" class="btn btn-secondary">🔄 Refresh</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            <!-- Dynamic Content Injected via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

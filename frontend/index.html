<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Inventory Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <h1>📦 Inventory & Order Management System</h1>
            <p>Operand Technologies • Client-Facing Application Portal</p>
        </header>

        <!-- Main Content -->
        <div class="grid-layout">
            <!-- Add Product Form Card -->
            <div class="card form-card">
                <h2>Add New Product</h2>
                <form id="product-form">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" placeholder="e.g., Wireless Mouse" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Office Supplies">Office Supplies</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" min="0" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price ($)</label>
                            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">➕ Save Item</button>
                </form>
            </div>

            <!-- Product Table Dashboard Card -->
            <div class="card table-card">
                <div class="table-header">
                    <h2>Stock Inventory List</h2>
                    <button id="refresh-btn" class="btn btn-secondary">🔄 Refresh</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            <!-- Dynamic Content Injected via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
